plugins {
    id 'java-library'
    id 'fabric-loom' version '1.14-SNAPSHOT'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
    maven { name = 'ClothConfig'; url = 'https://maven.shedaniel.me/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    modImplementation "com.terraformersmc:modmenu:${mod_menu_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
}

processResources {
    var expandProps = [
            'version'                : version,
            'fabric_loader_version'  : fabric_loader_version,
            'mod_name'               : mod_name,
            'mod_author'             : mod_author,
            'mod_id'                 : mod_id,
            'license'                : license,
            'description'            : project.description,
            'java_version'           : java_version
    ]
    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

jar {
    from(rootProject.file('LICENSE.md')) {
        rename { "${it}_${mod_name}" }
    }
}
